[package]
name = "dkls23ctl"
version = "0.1.0"
edition = "2021"
description = "CLI for threshold ECDSA (DKLs23) key generation, signing and resharing over iroh p2p"

[dependencies]
sl-dkls23 = "=1.0.0-beta"
sl-mpc-mate = { version = "=1.0.0-beta", features = ["simple-relay"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
rand = "0.8"

iroh = { version = "=1.0.0-rc.1", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = "=0.3.0"

tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "dkls23ctl"
path = "src/main.rs"

[lib]
name = "dkls23ctl"
path = "src/lib.rs"
